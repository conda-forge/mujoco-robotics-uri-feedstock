schema_version: 1

context:
  version: "0.1.3"

package:
  name: mujoco-robotics-uri
  version: ${{ version }}

source:
  - url: https://github.com/gbionics/mujoco-robotics-uri/archive/refs/tags/v${{ version }}.tar.gz
    sha256: 6e4329fe7659ca6a8faa4cb3be5fc05fdd5c75afbf8c51b3d28e3260421fa091

build:
  number: 0
  script:
    file: build

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - cmake >=3.26
    - ninja
  # The library always build against libmujoco, and then
  # has specific logic to handle ABI changes acroos mujoco versions, hence
  # why we ignore the tight run_exports of libmujoco. In case a new mujoco
  # version will change the ABI in a way not handled by a given release,
  # repodata patches will be used to limit the maximum mujoco version for
  # already released version of mujoco-robotics-uri
  host:
    - libmujoco 3.12.*
    - libresolve-robotics-uri-cpp >=0.6.2
  run:
    - libmujoco >=3.12
  ignore_run_exports:
    from_package:
      - libmujoco

tests:
  - package_contents:
      files:
        - if: linux
          then: bin/mujoco_plugin/libmujoco_robotics_uri.so
        - if: osx
          then: bin/mujoco_plugin/libmujoco_robotics_uri.dylib
        - if: win
          then: Library/bin/mujoco_plugin/mujoco_robotics_uri.dll
  - script: python -m pytest tests/test_provider.py -v
    requirements:
      run:
        - python
        - pytest
        - mujoco >=3.12
    files:
      source:
        - tests/test_provider.py

about:
  homepage: https://github.com/gbionics/mujoco-robotics-uri
  summary: MuJoCo resource provider for package, model, and robot URIs
  description: |
    A native MuJoCo resource provider that resolves package://, model://, and
    robot:// URIs with resolve-robotics-uri-cpp. The shared plugin binds to the
    already-loaded MuJoCo runtime and requires no Python registration helper.
  license: BSD-3-Clause
  license_file:
    - LICENSE
  repository: https://github.com/gbionics/mujoco-robotics-uri

extra:
  recipe-maintainers:
    - traversaro
